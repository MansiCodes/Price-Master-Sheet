version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - export NODE_TLS_REJECT_UNAUTHORIZED=0
        - export AUTH_TRUST_HOST=true
        - env | grep -v '^_' >> .env.production
        - echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env.production
        - echo "AUTH_TRUST_HOST=true" >> .env.production
        - npx prisma generate
    build:
      commands:
        - export NODE_TLS_REJECT_UNAUTHORIZED=0
        - export AUTH_TRUST_HOST=true
        - env | grep -v '^_' >> .env.production
        - echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env.production
        - echo "AUTH_TRUST_HOST=true" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
