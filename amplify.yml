version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - env | grep -v '^_' >> .env.production
        - npx prisma generate
    build:
      commands:
        - env | grep -v '^_' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
