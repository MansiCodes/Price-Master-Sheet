<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7ebe8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Cable Rates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="app">
      <header class="top">
        <div class="brand-row">
          <div class="brand-block">
            <p class="brand">Cable Rates</p>
          </div>
          <div class="header-actions mobile-only">
            <button id="exportBtnMobile" type="button" class="icon-btn" title="Export CSV" aria-label="Export CSV">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 3v12" />
                <path d="m7 10 5 5 5-5" />
                <path d="M5 19h14" />
              </svg>
            </button>
            <button id="syncBtnMobile" type="button" class="icon-btn icon-btn-primary" title="Sync Sheet" aria-label="Sync Sheet">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.6-6.4" />
                <path d="M21 3v6h-6" />
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar">
          <label class="search-wrap">
            <span class="sr-only">Search cable</span>
            <span class="search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
            </span>
            <input
              id="search"
              type="search"
              placeholder="Search cable, spec or S NO"
              autocomplete="off"
              enterkeyhint="search"
            />
          </label>

          <button id="exportBtn" type="button" class="btn btn-secondary desktop-inline" title="Export CSV">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M5 19h14" />
            </svg>
            Export
          </button>
          <button id="syncBtn" type="button" class="btn btn-primary desktop-inline">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.6-6.4" />
              <path d="M21 3v6h-6" />
            </svg>
            Sync
          </button>
        </div>
      </header>

      <main class="main">
        <section class="panel desktop-only">
          <div class="table-shell">
            <table class="rates-table">
              <thead>
                <tr>
                  <th class="col-sno">S NO.</th>
                  <th class="col-name">NAME OF CABLE</th>
                  <th class="col-spec">SPECIFICATION</th>
                  <th class="col-price">P=10%</th>
                  <th class="col-price">P=12%</th>
                  <th class="col-price">P=15%</th>
                  <th class="col-price">P=20%</th>
                </tr>
              </thead>
              <tbody id="ratesBody"></tbody>
            </table>
          </div>
        </section>

        <div id="mobileList" class="mobile-list mobile-only" aria-live="polite"></div>
      </main>

      <nav class="pagination" aria-label="Rates pagination">
        <label class="page-size-wrap">
          <span class="field-label">Per page</span>
          <select id="pageSize" aria-label="Rows per page">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </label>

        <button id="prevBtn" type="button" class="btn btn-ghost page-nav" disabled aria-label="Previous page">
          <span class="desktop-inline">Prev</span>
          <span class="mobile-only" aria-hidden="true">‹</span>
        </button>
        <div id="pageNumbers" class="page-numbers"></div>
        <button id="nextBtn" type="button" class="btn btn-ghost page-nav" disabled aria-label="Next page">
          <span class="desktop-inline">Next</span>
          <span class="mobile-only" aria-hidden="true">›</span>
        </button>
      </nav>
    </div>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
