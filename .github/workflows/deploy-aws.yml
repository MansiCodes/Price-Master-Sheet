# =============================================================================
# GitHub Actions → Amazon ECR → ECS Fargate
# Trigger: push to main (and manual workflow_dispatch)
#
# One-time AWS setup:
#  1. ECR repository (e.g. cable-junction)
#  2. ECS cluster + Fargate service + ALB
#  3. RDS Postgres (DATABASE_URL)
#  4. Task definition with env/secrets (AUTH_SECRET, DATABASE_URL, …)
#  5. GitHub secrets / vars listed below
# =============================================================================

name: Deploy to AWS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'cable-junction' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'cable-junction-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'cable-junction-service' }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || 'cable-junction' }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'cable-junction' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Setup Node (for Prisma migrate)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps & push schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — skipping prisma db push"
            exit 0
          fi
          npm ci
          npx prisma generate
          npx prisma db push

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_DEFINITION }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
